name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: design-system-ci-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Make checks and distributable package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          package-manager-cache: false

      - name: Install dependencies
        run: make install

      - name: Run checks and build distributable archive
        run: make pack
