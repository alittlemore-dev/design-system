@if (selectedRoute().startsWith('/preview/')) {
  <router-outlet />
} @else {
  <main class="demo-shell" data-demo-shell>
    <header class="demo-header">
      <div>
        <p class="demo-kicker">Packed archive consumer</p>
        <p class="demo-title">Design system</p>
        <p class="demo-subtitle">Interactive component catalogue</p>
      </div>
      <div class="theme-switcher" aria-label="Theme">
        <button
          type="button"
          class="btn btn-sm"
          [class.btn-primary]="themeService.theme() === 'light'"
          [class.btn-outline-secondary]="themeService.theme() !== 'light'"
          data-demo-theme="light"
          (click)="themeService.setTheme('light')"
        >
          Light
        </button>
        <button
          type="button"
          class="btn btn-sm"
          [class.btn-primary]="themeService.theme() === 'dark'"
          [class.btn-outline-secondary]="themeService.theme() !== 'dark'"
          data-demo-theme="dark"
          (click)="themeService.setTheme('dark')"
        >
          Dark
        </button>
      </div>
    </header>

    <ds-sidebar
      data-demo-sidebar
      panelId="catalogue-navigation-panel"
      label="Catalogue"
      openLabel="Open catalogue"
      closeLabel="Close catalogue"
      [open]="navigationOpen()"
      (openChange)="navigationOpen.set($event)"
    >
      <ds-navigation
        dsSidebarNavigation
        id="catalogue-navigation"
        label="Component navigation"
        [rootItems]="rootItems"
        [groups]="groups"
        [selectedItemKey]="selectedRoute()"
        emptyMessage="No demo pages"
        (itemSelected)="navigate($event)"
      />
      <div class="demo-content"><router-outlet /></div>
    </ds-sidebar>
  </main>
}
