<main class="demo-shell" data-demo-shell>
  <header class="demo-header">
    <div>
      <p class="demo-kicker">Packed archive consumer</p>
      <p class="demo-title">Design system</p>
      <p class="demo-subtitle">Interactive component catalogue</p>
    </div>
    <div class="theme-switcher" aria-label="Theme">
      <button
        type="button"
        class="btn btn-sm"
        [class.btn-primary]="themeService.theme() === 'light'"
        [class.btn-outline-secondary]="themeService.theme() !== 'light'"
        data-demo-theme="light"
        (click)="themeService.setTheme('light')"
      >
        Light
      </button>
      <button
        type="button"
        class="btn btn-sm"
        [class.btn-primary]="themeService.theme() === 'dark'"
        [class.btn-outline-secondary]="themeService.theme() !== 'dark'"
        data-demo-theme="dark"
        (click)="themeService.setTheme('dark')"
      >
        Dark
      </button>
    </div>
  </header>

  <div class="demo-layout">
    <aside class="demo-sidebar" data-demo-sidebar aria-label="Component navigation">
      <div class="demo-sidebar-heading">
        <p class="demo-sidebar-label">Catalogue</p>
        <button
          type="button"
          class="btn btn-sm btn-outline-secondary demo-sidebar-toggle"
          [attr.aria-expanded]="mobileNavigationOpen()"
          aria-controls="demo-sidebar-tree"
          (click)="mobileNavigationOpen.set(!mobileNavigationOpen())"
        >
          {{ mobileNavigationOpen() ? 'Hide components' : 'Browse components' }}
        </button>
      </div>
      <div
        id="demo-sidebar-tree"
        class="demo-sidebar-tree"
        data-demo-sidebar-tree
        [class.demo-sidebar-tree-open]="mobileNavigationOpen()"
      >
        <ds-foldable-tree
          [rootItems]="rootItems"
          [sections]="sections"
          emptyMessage="No demo pages"
          [selectedItemKey]="selectedRoute()"
          [defaultExpandedSectionKeys]="expandedSectionKeys"
          sectionTestId="demo-nav-section"
          itemTestId="demo-nav-item"
          (itemSelected)="navigate($event)"
        />
      </div>
    </aside>

    <div class="demo-content">
      <router-outlet />
    </div>
  </div>
</main>
