<div class="localized-date-range-picker">
  <ds-temporal-picker-field
    [range]="true"
    [inputId]="inputId()"
    [startText]="startText()"
    [endText]="endText()"
    [groupLabel]="labels().groupLabel"
    [triggerLabel]="triggerLabel()"
    [startLabel]="labels().startDate"
    [endLabel]="labels().endDate"
    [accessibleSeparator]="labels().accessibleRangeSeparator"
    [activeBoundary]="activeBoundary()"
    [startInvalid]="startInvalid()"
    [endInvalid]="endInvalid()"
    [startRequired]="startRequired()"
    [endRequired]="endRequired()"
    [controlSize]="controlSize()"
    [disabled]="effectiveDisabled()"
    [readonly]="readonly()"
    [startDescribedBy]="inputDescribedBy()"
    [endDescribedBy]="inputDescribedBy()"
    [startErrorId]="errorId"
    [endErrorId]="errorId"
    [placeholder]="labels().placeholder"
    [expanded]="calendarOpen()"
    [dialogId]="calendarId"
    iconKind="calendar"
    (endpointInput)="onTextInput($event)"
    (endpointBlur)="onTextComplete($event)"
    (endpointEnter)="onTextComplete($event)"
    (endpointEscape)="restoreManualText()"
    (endpointActivated)="setActiveBoundary($event)"
    (triggerActivated)="toggleCalendar()"
  />
  <div [id]="formatHintId" class="visually-hidden">{{ labels().dateFormatHint }}</div>
  @if (effectiveInvalid()) {
    <div
      [id]="errorId"
      class="invalid-feedback d-block"
      data-testid="date-range-validation-message"
      role="alert"
    >
      {{ validationMessage() }}
    </div>
  }
  <ds-calendar-dialog
    #calendarDialog
    [dialogId]="calendarId"
    [dateLocale]="dateLocale()"
    [labels]="dialogLabels()"
    kind="date"
    [range]="true"
    [draft]="dialogDraft()"
    [canConfirm]="canConfirmDialog()"
    [canClear]="canClear()"
    [disabled]="effectiveDisabled()"
    [readonly]="readonly()"
    [activeBoundary]="activeBoundary()"
    [activeBoundaryLabel]="activeBoundaryLabel()"
    [min]="min()"
    [max]="max()"
    [disabledDates]="disabledDates()"
    (draftChange)="onDialogDraftChange($event)"
    (activeBoundaryChange)="setActiveBoundary($event)"
    (cleared)="clearDialogDraft()"
    (cancelled)="cancelDialog()"
    (done)="confirmDialog()"
  />
</div>
