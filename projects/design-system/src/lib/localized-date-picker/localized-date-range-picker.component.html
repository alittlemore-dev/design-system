<div class="localized-date-range-picker">
  <div
    class="localized-date-range-picker-group"
    data-testid="date-range-group"
    role="group"
    [attr.aria-label]="labels().groupLabel"
  >
    <div class="localized-date-range-picker-field">
      <label [for]="inputId()">{{ labels().startDate }}</label>
      <div class="input-group">
        <input
          #startInput
          [id]="inputId()"
          type="text"
          class="form-control"
          [class.form-control-sm]="controlSize() === 'small'"
          inputmode="numeric"
          autocomplete="off"
          [attr.placeholder]="labels().placeholder"
          [attr.title]="labels().formatHint"
          [attr.aria-describedby]="inputDescribedBy()"
          [attr.aria-errormessage]="effectiveInvalid() ? errorId : null"
          [attr.aria-required]="required() ? 'true' : null"
          [attr.aria-invalid]="effectiveInvalid() ? 'true' : null"
          [required]="required()"
          [readOnly]="readonly()"
          [disabled]="effectiveDisabled()"
          [class.is-invalid]="effectiveInvalid()"
          [value]="displayStart()"
          (input)="onTextInput('start', $event)"
          (blur)="onTextBlur()"
        />
        <button
          #startToggle
          type="button"
          class="btn btn-outline-secondary localized-date-picker-toggle"
          [class.btn-sm]="controlSize() === 'small'"
          data-testid="date-range-start-toggle"
          aria-haspopup="dialog"
          [attr.aria-label]="startToggleAriaLabel()"
          [attr.aria-controls]="calendarId"
          [attr.aria-expanded]="calendarOpen()"
          [disabled]="effectiveDisabled() || readonly()"
          (click)="toggleStartCalendar(startToggle)"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M8 2v4"></path>
            <path d="M16 2v4"></path>
            <rect width="18" height="18" x="3" y="4" rx="2"></rect>
            <path d="M3 10h18"></path>
          </svg>
        </button>
      </div>
    </div>
    <div class="localized-date-range-picker-field">
      <label [for]="inputId() + '-end-date'">{{ labels().endDate }}</label>
      <div class="input-group">
        <input
          #endInput
          [id]="inputId() + '-end-date'"
          type="text"
          class="form-control"
          [class.form-control-sm]="controlSize() === 'small'"
          inputmode="numeric"
          autocomplete="off"
          [attr.placeholder]="labels().placeholder"
          [attr.title]="labels().formatHint"
          [attr.aria-describedby]="inputDescribedBy()"
          [attr.aria-errormessage]="effectiveInvalid() ? errorId : null"
          [attr.aria-required]="required() ? 'true' : null"
          [attr.aria-invalid]="effectiveInvalid() ? 'true' : null"
          [required]="required()"
          [readOnly]="readonly()"
          [disabled]="effectiveDisabled()"
          [class.is-invalid]="effectiveInvalid()"
          [value]="displayEnd()"
          (input)="onTextInput('end', $event)"
          (blur)="onTextBlur()"
        />
        <button
          #endToggle
          type="button"
          class="btn btn-outline-secondary localized-date-picker-toggle"
          [class.btn-sm]="controlSize() === 'small'"
          data-testid="date-range-end-toggle"
          aria-haspopup="dialog"
          [attr.aria-label]="endToggleAriaLabel()"
          [attr.aria-controls]="calendarId"
          [attr.aria-expanded]="calendarOpen()"
          [disabled]="effectiveDisabled() || readonly()"
          (click)="toggleEndCalendar(endToggle)"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M8 2v4"></path>
            <path d="M16 2v4"></path>
            <rect width="18" height="18" x="3" y="4" rx="2"></rect>
            <path d="M3 10h18"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <div [id]="formatHintId" class="visually-hidden">{{ labels().formatHint }}</div>
  @if (effectiveInvalid()) {
    <div
      [id]="errorId"
      class="invalid-feedback d-block"
      data-testid="date-range-validation-message"
      role="alert"
    >
      {{ validationMessage() }}
    </div>
  }
  <ds-calendar-dialog
    #calendarDialog
    [dialogId]="calendarId"
    [dateLocale]="dateLocale()"
    [labels]="labels()"
    [required]="required()"
    [canClear]="canClear()"
    [disabled]="effectiveDisabled()"
    [readonly]="readonly()"
    [rangeStart]="calendarRange().start"
    [rangeEnd]="calendarRange().end"
    [activeBoundary]="activeBoundary()"
    [activeBoundaryLabel]="activeBoundaryLabel()"
    [min]="min()"
    [max]="max()"
    [disabledDates]="disabledDates()"
    (dateSelected)="selectDate($event)"
    (cleared)="clearRange()"
    (closed)="onCalendarClosed()"
  />
</div>
