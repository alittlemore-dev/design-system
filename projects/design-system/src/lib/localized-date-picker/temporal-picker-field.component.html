<div
  class="temporal-picker-field-shell"
  data-testid="temporal-picker-field"
  role="group"
  [attr.aria-label]="groupLabel()"
  [attr.aria-disabled]="disabled() || null"
  [class.temporal-picker-field-disabled]="disabled()"
  [class.temporal-picker-field-readonly]="readonly()"
>
  <div
    class="temporal-picker-field-endpoint"
    [class.temporal-picker-field-endpoint-active]="
      activeBoundary() === (range() ? 'start' : 'single')
    "
    [class.temporal-picker-field-endpoint-invalid]="startInvalid()"
    [attr.data-invalid]="startInvalid() ? 'true' : null"
  >
    <input
      [id]="inputId()"
      type="text"
      class="form-control temporal-picker-field-input"
      [class.form-control-sm]="controlSize() === 'small'"
      [class.is-invalid]="startInvalid()"
      inputmode="text"
      autocomplete="off"
      [attr.placeholder]="placeholder() || null"
      [attr.aria-label]="startLabel()"
      [attr.aria-describedby]="startDescribedBy() || null"
      [attr.aria-errormessage]="startInvalid() ? startErrorId() || null : null"
      [attr.aria-invalid]="startInvalid() ? 'true' : null"
      [attr.aria-required]="startRequired() ? 'true' : null"
      [attr.aria-readonly]="readonly() || null"
      [required]="startRequired()"
      [readOnly]="readonly()"
      [disabled]="disabled()"
      [value]="startText()"
      (input)="onEndpointInput(range() ? 'start' : 'single', $event)"
      (blur)="onEndpointBlur(range() ? 'start' : 'single', $event)"
      (keydown)="onEndpointKeydown(range() ? 'start' : 'single', $event)"
      (focus)="onEndpointActivated(range() ? 'start' : 'single')"
      (click)="onEndpointActivated(range() ? 'start' : 'single')"
    />
  </div>
  @if (range()) {
    <span
      class="temporal-picker-field-separator"
      data-testid="temporal-picker-field-separator"
      aria-hidden="true"
      >–</span
    >
    <span class="visually-hidden">{{ accessibleSeparator() }}</span>
    <div
      class="temporal-picker-field-endpoint"
      [class.temporal-picker-field-endpoint-active]="activeBoundary() === 'end'"
      [class.temporal-picker-field-endpoint-invalid]="endInvalid()"
      [attr.data-invalid]="endInvalid() ? 'true' : null"
    >
      <input
        [id]="inputId() + '-end'"
        type="text"
        class="form-control temporal-picker-field-input"
        [class.form-control-sm]="controlSize() === 'small'"
        [class.is-invalid]="endInvalid()"
        inputmode="text"
        autocomplete="off"
        [attr.placeholder]="placeholder() || null"
        [attr.aria-label]="endLabel()"
        [attr.aria-describedby]="endDescribedBy() || null"
        [attr.aria-errormessage]="endInvalid() ? endErrorId() || null : null"
        [attr.aria-invalid]="endInvalid() ? 'true' : null"
        [attr.aria-required]="endRequired() ? 'true' : null"
        [attr.aria-readonly]="readonly() || null"
        [required]="endRequired()"
        [readOnly]="readonly()"
        [disabled]="disabled()"
        [value]="endText()"
        (input)="onEndpointInput('end', $event)"
        (blur)="onEndpointBlur('end', $event)"
        (keydown)="onEndpointKeydown('end', $event)"
        (focus)="onEndpointActivated('end')"
        (click)="onEndpointActivated('end')"
      />
    </div>
  }
  <button
    class="btn temporal-picker-field-trigger"
    data-testid="temporal-picker-field-trigger"
    type="button"
    [class.btn-sm]="controlSize() === 'small'"
    aria-haspopup="dialog"
    [attr.aria-label]="triggerLabel() || groupLabel()"
    [attr.aria-controls]="dialogId() || null"
    [attr.aria-expanded]="expanded()"
    [disabled]="disabled() || readonly()"
    (click)="onTriggerActivated()"
  >
    @if (iconKind() === 'clock') {
      <svg
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 7v5l3 2"></path>
      </svg>
    } @else {
      <svg
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M8 2v4"></path>
        <path d="M16 2v4"></path>
        <rect width="18" height="18" x="3" y="4" rx="2"></rect>
        <path d="M3 10h18"></path>
      </svg>
    }
  </button>
</div>
