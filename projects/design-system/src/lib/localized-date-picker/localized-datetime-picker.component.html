<div class="localized-datetime-picker">
  <div
    class="localized-datetime-picker-group"
    data-testid="datetime-picker-group"
    role="group"
    [attr.aria-label]="labels().groupLabel"
  >
    <div class="localized-datetime-picker-field">
      <label [for]="inputId()">{{ labels().dateInput }}</label>
      <div class="input-group">
        <input
          #dateInput
          [id]="inputId()"
          type="text"
          class="form-control"
          [class.form-control-sm]="controlSize() === 'small'"
          inputmode="numeric"
          autocomplete="off"
          [attr.placeholder]="labels().placeholder"
          [attr.title]="labels().formatHint"
          [attr.aria-describedby]="dateDescribedBy()"
          [attr.aria-errormessage]="effectiveInvalid() ? errorId : null"
          [attr.aria-required]="required() ? 'true' : null"
          [attr.aria-invalid]="effectiveInvalid() ? 'true' : null"
          [required]="required()"
          [readOnly]="readonly()"
          [disabled]="effectiveDisabled()"
          [class.is-invalid]="effectiveInvalid()"
          [value]="displayDate()"
          (input)="onDateInput($event)"
          (blur)="onInputBlur()"
        />
        <button
          #calendarToggle
          type="button"
          class="btn btn-outline-secondary localized-date-picker-toggle"
          [class.btn-sm]="controlSize() === 'small'"
          data-testid="datetime-picker-toggle"
          aria-haspopup="dialog"
          [attr.aria-label]="toggleAriaLabel()"
          [attr.aria-controls]="calendarId"
          [attr.aria-expanded]="calendarOpen()"
          [disabled]="effectiveDisabled() || readonly()"
          (click)="toggleCalendar()"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M8 2v4"></path>
            <path d="M16 2v4"></path>
            <rect width="18" height="18" x="3" y="4" rx="2"></rect>
            <path d="M3 10h18"></path>
          </svg>
        </button>
      </div>
    </div>
    <div class="localized-datetime-picker-field">
      <label [for]="inputId() + '-time'">{{ labels().timeInput }}</label>
      <input
        #timeInput
        [id]="inputId() + '-time'"
        type="time"
        step="60"
        [attr.min]="minimumTime()"
        [attr.max]="maximumTime()"
        class="form-control"
        [class.form-control-sm]="controlSize() === 'small'"
        [attr.aria-describedby]="timeDescribedBy()"
        [attr.aria-errormessage]="effectiveInvalid() ? errorId : null"
        [attr.aria-required]="required() ? 'true' : null"
        [attr.aria-invalid]="effectiveInvalid() ? 'true' : null"
        [required]="required()"
        [readOnly]="readonly()"
        [disabled]="effectiveDisabled()"
        [class.is-invalid]="effectiveInvalid()"
        [value]="displayTime()"
        (input)="onTimeInput($event)"
        (blur)="onInputBlur()"
      />
    </div>
  </div>
  <div [id]="dateHintId" class="visually-hidden">{{ labels().formatHint }}</div>
  <div [id]="timeHintId" class="visually-hidden">{{ labels().timeFormatHint }}</div>
  @if (effectiveInvalid()) {
    <div
      [id]="errorId"
      class="invalid-feedback d-block"
      data-testid="datetime-picker-validation-message"
      role="alert"
    >
      {{ validationMessage() }}
    </div>
  }
  <ds-calendar-dialog
    #calendarDialog
    [dialogId]="calendarId"
    [dateLocale]="dateLocale()"
    [labels]="labels()"
    [required]="required()"
    [canClear]="canClear()"
    [disabled]="effectiveDisabled()"
    [readonly]="readonly()"
    [selectedDate]="selectedDate()"
    [min]="minimumDate()"
    [max]="maximumDate()"
    [disabledDates]="disabledDates()"
    (dateSelected)="selectDate($event)"
    (cleared)="clearDateTime()"
    (closed)="onCalendarClosed()"
  />
</div>
